<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" font-family="'Helvetica Neue', Arial, sans-serif">
  <!-- Title -->
  <text x="200" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Position Value from Topology</text>
  <text x="200" y="42" text-anchor="middle" font-size="11" fill="#888">Incidence degree to win transitions</text>

  <!-- Grid background -->
  <g transform="translate(80, 60)">
    <!-- Row 0 -->
    <rect x="0" y="0" width="80" height="80" fill="#ffb74d" stroke="#fff" stroke-width="3" rx="4"/>
    <rect x="80" y="0" width="80" height="80" fill="#ffe0b2" stroke="#fff" stroke-width="3" rx="4"/>
    <rect x="160" y="0" width="80" height="80" fill="#ffb74d" stroke="#fff" stroke-width="3" rx="4"/>
    <!-- Row 1 -->
    <rect x="0" y="80" width="80" height="80" fill="#ffe0b2" stroke="#fff" stroke-width="3" rx="4"/>
    <rect x="80" y="80" width="80" height="80" fill="#e65100" stroke="#fff" stroke-width="3" rx="4"/>
    <rect x="160" y="80" width="80" height="80" fill="#ffe0b2" stroke="#fff" stroke-width="3" rx="4"/>
    <!-- Row 2 -->
    <rect x="0" y="160" width="80" height="80" fill="#ffb74d" stroke="#fff" stroke-width="3" rx="4"/>
    <rect x="80" y="160" width="80" height="80" fill="#ffe0b2" stroke="#fff" stroke-width="3" rx="4"/>
    <rect x="160" y="160" width="80" height="80" fill="#ffb74d" stroke="#fff" stroke-width="3" rx="4"/>

    <!-- Degree numbers -->
    <text x="40" y="35" text-anchor="middle" font-size="28" font-weight="bold" fill="#fff">3</text>
    <text x="120" y="35" text-anchor="middle" font-size="28" font-weight="bold" fill="#e65100">2</text>
    <text x="200" y="35" text-anchor="middle" font-size="28" font-weight="bold" fill="#fff">3</text>

    <text x="40" y="115" text-anchor="middle" font-size="28" font-weight="bold" fill="#e65100">2</text>
    <text x="120" y="115" text-anchor="middle" font-size="28" font-weight="bold" fill="#fff">4</text>
    <text x="200" y="115" text-anchor="middle" font-size="28" font-weight="bold" fill="#e65100">2</text>

    <text x="40" y="195" text-anchor="middle" font-size="28" font-weight="bold" fill="#fff">3</text>
    <text x="120" y="195" text-anchor="middle" font-size="28" font-weight="bold" fill="#e65100">2</text>
    <text x="200" y="195" text-anchor="middle" font-size="28" font-weight="bold" fill="#fff">3</text>

    <!-- Position type labels -->
    <text x="40" y="55" text-anchor="middle" font-size="10" fill="#fff" opacity="0.8">corner</text>
    <text x="120" y="55" text-anchor="middle" font-size="10" fill="#e65100" opacity="0.7">edge</text>
    <text x="200" y="55" text-anchor="middle" font-size="10" fill="#fff" opacity="0.8">corner</text>

    <text x="40" y="135" text-anchor="middle" font-size="10" fill="#e65100" opacity="0.7">edge</text>
    <text x="120" y="135" text-anchor="middle" font-size="10" fill="#fff" opacity="0.8">center</text>
    <text x="200" y="135" text-anchor="middle" font-size="10" fill="#e65100" opacity="0.7">edge</text>

    <text x="40" y="215" text-anchor="middle" font-size="10" fill="#fff" opacity="0.8">corner</text>
    <text x="120" y="215" text-anchor="middle" font-size="10" fill="#e65100" opacity="0.7">edge</text>
    <text x="200" y="215" text-anchor="middle" font-size="10" fill="#fff" opacity="0.8">corner</text>
  </g>

  <!-- Legend -->
  <g transform="translate(80, 315)">
    <rect x="0" y="0" width="16" height="16" fill="#e65100" rx="2"/>
    <text x="22" y="13" font-size="11" fill="#444">4 win lines (center)</text>

    <rect x="0" y="22" width="16" height="16" fill="#ffb74d" rx="2"/>
    <text x="22" y="35" font-size="11" fill="#444">3 win lines (corners)</text>

    <rect x="0" y="44" width="16" height="16" fill="#ffe0b2" rx="2"/>
    <text x="22" y="57" font-size="11" fill="#444">2 win lines (edges)</text>
  </g>

  <!-- ODE scores annotation -->
  <text x="330" y="328" text-anchor="middle" font-size="10" fill="#888">ODE scores:</text>
  <text x="330" y="342" text-anchor="middle" font-size="10" fill="#888">1.27 : 0.95 : 0.63</text>
  <text x="330" y="356" text-anchor="middle" font-size="10" fill="#888">(ratio ~ 4 : 3 : 2)</text>
</svg>
