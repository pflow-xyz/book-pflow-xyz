<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="900" fill="url(#bg)"/>

  <!-- Petri net diagram -->
  <!-- Places (circles) -->
  <circle cx="200" cy="380" r="32" fill="none" stroke="#e94560" stroke-width="2.5"/>
  <circle cx="400" cy="380" r="32" fill="none" stroke="#e94560" stroke-width="2.5"/>
  <circle cx="300" cy="520" r="32" fill="none" stroke="#e94560" stroke-width="2.5"/>

  <!-- Tokens -->
  <circle cx="200" cy="380" r="8" fill="#e94560"/>
  <circle cx="192" cy="372" r="8" fill="#e94560"/>
  <circle cx="400" cy="380" r="8" fill="#e94560"/>

  <!-- Transitions (rectangles) -->
  <rect x="285" y="355" width="30" height="50" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
  <rect x="185" y="470" width="30" height="50" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
  <rect x="385" y="470" width="30" height="50" fill="#0f3460" stroke="#e94560" stroke-width="2"/>

  <!-- Arcs -->
  <line x1="232" y1="380" x2="285" y2="380" stroke="#e8e8e8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="315" y1="380" x2="368" y2="380" stroke="#e8e8e8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="412" x2="200" y2="470" stroke="#e8e8e8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="412" x2="400" y2="470" stroke="#e8e8e8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="215" y1="495" x2="268" y2="520" stroke="#e8e8e8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="385" y1="495" x2="332" y2="520" stroke="#e8e8e8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e8e8e8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="160" text-anchor="middle" fill="#e8e8e8" font-family="Georgia, serif" font-size="36" font-weight="bold">Petri Nets as a</text>
  <text x="300" y="210" text-anchor="middle" fill="#e8e8e8" font-family="Georgia, serif" font-size="36" font-weight="bold">Universal Abstraction</text>

  <!-- Subtitle -->
  <text x="300" y="270" text-anchor="middle" fill="#a8a8a8" font-family="Georgia, serif" font-size="18" font-style="italic">A Practitioner's Guide to Modeling with pflow</text>

  <!-- Author -->
  <text x="300" y="780" text-anchor="middle" fill="#a8a8a8" font-family="Georgia, serif" font-size="22">stackdump</text>

  <!-- Decorative line -->
  <line x1="150" y1="740" x2="450" y2="740" stroke="#e94560" stroke-width="1" opacity="0.5"/>
</svg>
